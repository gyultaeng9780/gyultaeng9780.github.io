<!doctype html><html><head><meta charset=utf-8><title>귤탱</title><meta name="description" content="귤탱 프로필"><meta property="og:type" content="website"><meta property="og:url" content="https://gyultaeng9780.github.io/"><meta property="og:title" content="귤탱"><meta property="og:description" content="귤탱 프로필"><meta property="og:image" content="https://gyultaeng9780.github.io/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://gyultaeng9780.github.io/og.png"><style>html.loading body{opacity:0}body{transition:opacity .25s}</style><script>document.documentElement.classList.add("loading");setTimeout(function(){document.documentElement.classList.remove("loading")},2500)</script><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><!--page-start-->
<title>귤탱 프로필</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gothic+A1:wght@400;600;700;800&amp;family=IBM+Plex+Sans+KR:wght@600&amp;display=swap">
<style>
/* 레이아웃: 책상 위 작업 폴더 — 탭 달린 폴더 / 테이프 붙인 대표 그림 / 링으로 묶인 두 장의 모눈 노트 (왼쪽 작가증, 오른쪽 정보) / 스티커 */
@font-face{font-family:"LINESeed";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2") format("woff2");font-weight:100 400;font-display:swap}@font-face{font-family:"LINESeed";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2") format("woff2");font-weight:500 900;font-display:swap}
:root{
  --desk:#ffffff;
  --folder:#ffeaa6;
  --paper:#fffdf5;
  --grid:#f5ead0;
  --ink:#4b3326;
  --edge:#e2b583;
  --muted:#8b7563;
  --orange:#ef8a33;
  --orange-ink:#c4651a;
  --yellow:#ffd06e;
  --coral:#f59a7a;
  --peach:#fff2bf;
  --blue:#7f9be0;
  --ring:#c9c6c0;
  --font-display:"Jua","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"LINESeed","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --line:2px solid var(--edge);
  --sp:20px;   /* 큰 간격: 폴더·노트·카드 안팎 */
  --sp-s:10px; /* 작은 간격: 제목과 내용, 칸과 칸 사이 */
  --drop:0 2px 4px rgba(150,105,50,.10),0 10px 22px rgba(150,105,50,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 그림 칸 공통 */
.slot{position:relative;display:grid;place-items:center;overflow:hidden;max-width:100%}
.slot img{display:block;width:100%;height:100%;object-fit:contain}
.slot.cover img{object-fit:cover}
.slot.empty{background:repeating-linear-gradient(45deg,#fff8dd 0 10px,#fff1c4 10px 20px)}
.slot .pick{display:none}
body.editing .slot{outline:2px dashed var(--orange);outline-offset:2px;cursor:pointer}
body.editing .slot .pick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,248,235,.55)}
.pick span{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 12px;border-radius:14px;line-height:1;background:var(--orange);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.slot.small .pick span{height:22px;padding:0 8px;font-size:11px;border-radius:11px}
.slot.tiny .pick span{width:22px;height:22px;padding:0;border-radius:50%;font-size:15px}

/* 폴더 */
.tab{position:relative;z-index:2;display:inline-flex;align-items:center;margin-bottom:-1px;padding:12px 16px 8px;background:var(--folder);border-radius:20px 20px 0 0}
.tab span{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 16px;line-height:1;border-radius:8px;background:var(--yellow);font-family:var(--font-display);font-size:19px;color:rgba(75,51,38,.5)}
.folder{position:relative;z-index:1;background:var(--folder);border-radius:0 22px 22px 22px;padding:var(--sp);display:flex;flex-direction:column;gap:var(--sp)}

/* 대표 긴 그림 + 테이프 */
.cover-wrap{position:relative;z-index:5;transform:rotate(-0.8deg)}
.hero{width:100%;aspect-ratio:4/1;border-radius:3px;background:var(--paper);box-shadow:var(--drop)}
.tape{position:absolute;z-index:2;width:86px;height:26px;background:rgba(255,232,170,.85);border:1px solid rgba(75,51,38,.15)}

/* 엽서 */
.postcard{position:absolute;right:-14px;top:-38px;z-index:4;width:48%;padding:0;
  border:8px solid transparent;border-radius:4px;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,rgba(255,214,102,.22),rgba(255,255,255,0) 45%,rgba(255,214,102,.16)) border-box,#fff border-box;
  transform:rotate(-4deg);box-shadow:var(--drop)}

.pc-pic{position:relative;width:100%;aspect-ratio:3/2;border-radius:2px;overflow:hidden;background:#fff1c4}
.pc-pic img{display:block;width:100%;height:100%;object-fit:cover}
.pc-credit{margin:0 0 -5px;padding:5px 1px 0;font-size:9.5px;line-height:1.15;color:rgba(75,51,38,.55);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-credit a{color:inherit;text-decoration:none}
.pc-credit-in{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.pc-credit-in input{flex:1;min-width:0;height:26px;padding:0 8px;border:1px solid var(--grid);border-radius:6px;font:inherit;font-size:12px;color:var(--ink);background:#fff}
.pc-thumbs figure{cursor:pointer}.pc-thumbs figure.on{outline:2px solid var(--orange-ink);outline-offset:1px}
.pc-pic::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;box-shadow:inset 0 2px 5px rgba(80,50,20,.28),inset 0 0 0 1px rgba(80,50,20,.08)}
.pc-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1;font-family:var(--font-display);font-size:15px;letter-spacing:.14em;color:var(--orange-ink);opacity:.55}
.pc-edit{display:flex;flex-direction:column;gap:8px;padding:10px}
.pc-thumbs{display:flex;flex-wrap:wrap;gap:6px}
.pc-thumbs figure{position:relative;margin:0;width:46px;height:31px;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(150,105,50,.3)}
.pc-thumbs img{display:block;width:100%;height:100%;object-fit:cover}
.pc-thumbs button{position:absolute;top:1px;right:1px;display:flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;line-height:1;border:0;border-radius:50%;background:rgba(75,51,38,.75);color:#fff;font-size:11px;cursor:pointer}
#pcAdd{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 12px;line-height:1;border:0;border-radius:15px;background:var(--orange);color:#fff;font:700 12px var(--font-body);cursor:pointer}
.pc-hint{margin:0;font-size:11px;line-height:1.5;color:var(--muted)}

/* 제목줄 */
.titlebar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-s);margin-top:6px}
/* 맨 위 그림이 기울어 왼쪽 아래 모서리가 내려온 만큼 보정해서 제목 위아래 여백을 같게 맞춤 */
.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-s)}
.icons a{display:block;width:46px;height:46px;border-radius:12px;box-shadow:0 2px 6px rgba(150,105,50,.18);transition:transform .15s}
.icons a:hover{transform:translateY(-3px) rotate(-6deg)}
.icons a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.icons img{display:block;width:100%;height:100%}
.icon-edit{width:100%;display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--paper);border-radius:12px;box-shadow:var(--drop)}
.icon-edit[hidden]{display:none}
.icon-edit .ttl{font-size:11px;font-weight:700;color:var(--orange-ink)}
.ie-row{display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;align-items:center;gap:8px}
.ie-row img{width:28px;height:28px;border-radius:7px}
.ie-row b{font-size:12px}
.page.left .ie-row{grid-template-columns:28px minmax(0,1fr) auto}
.page.left .ie-row b{display:none}
.ie-row input{width:100%;min-width:0;font:12px/1.4 var(--font-body);color:var(--ink);background:#fff;border:2px solid var(--grid);border-radius:8px;padding:5px 8px}
.ie-row input:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.ie-row .mv{display:flex;gap:4px}
.ie-row .mv button{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;line-height:1;border:0;border-radius:8px;background:#fff;color:var(--ink);font-size:12px;cursor:pointer;box-shadow:0 1px 3px rgba(150,105,50,.25)}
.ie-row .mv button:disabled{opacity:.35;cursor:default}
body.editing .icons{pointer-events:none}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:36px;line-height:1.1;letter-spacing:.01em;text-wrap:balance}
.oval{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 18px;line-height:1;border-radius:999px;background:var(--paper);box-shadow:var(--drop);font-family:var(--font-display);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.tags span{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 12px;line-height:1;background:var(--peach);border-radius:4px;font-size:12px;font-weight:700}

/* 바인더 */
.binder{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1.45fr);align-items:stretch}
.page{position:relative;z-index:1;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,22px 22px,22px 22px;border-radius:16px;padding:var(--sp);min-width:0}
.page{--spine:transparent;--s1:#f8efd8;--s2:#f2e6c8;--s3:#ecdcb8}
.page.left{background-image:linear-gradient(to left,var(--spine),transparent 22px,transparent 46px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  box-shadow:-3px 3px 0 var(--s1),-6px 6px 0 var(--s2),-9px 9px 0 var(--s3),-4px 16px 20px rgba(150,105,50,.2)}
.page.right{background-image:linear-gradient(to right,var(--spine),transparent 22px,transparent 46px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  box-shadow:3px 3px 0 var(--s1),6px 6px 0 var(--s2),9px 9px 0 var(--s3),4px 16px 20px rgba(150,105,50,.2)}
.page.left{border-radius:16px 6px 6px 16px;display:flex;flex-direction:column;gap:var(--sp)}
.pcard .tags{justify-content:center;gap:6px}
.pcard .tags span{height:24px;padding:0 10px;font-family:"IBM Plex Sans KR",var(--font-body);font-weight:600;font-size:12px;letter-spacing:0}
.memo{position:relative;flex:1;min-height:170px;margin:0;padding:26px 18px 18px;background-color:#fff6c2;background-image:repeating-linear-gradient(transparent 0 27px,#f3dc8c 27px 28px);background-position:0 52px;border-radius:4px 4px 14px 4px;transform:rotate(-1deg);box-shadow:var(--drop)}
.memo .tape{left:50%;top:-13px;transform:translateX(-50%) rotate(2deg)}
.memo-title{font-family:var(--font-display);font-size:16px;line-height:1;color:var(--orange-ink);letter-spacing:.1em;margin-bottom:8px}
.memo-text{font-size:13px;line-height:28px;white-space:pre-wrap;word-break:break-word}
.memo-edit{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--orange-ink)}
.memo-edit[hidden]{display:none}
.memo textarea{width:100%;min-height:140px;font:13px/1.7 var(--font-body);color:var(--ink);background:#fffbe0;border:2px solid #f3dc8c;border-radius:8px;padding:8px 10px;resize:vertical}
.memo textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.page.right{border-radius:6px 16px 16px 6px;display:flex;flex-direction:column;gap:var(--sp)}
.page.left{padding-right:calc(var(--sp) + 12px)}
.page.right{padding-left:calc(var(--sp) + 12px)}
.rings{position:relative;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;margin:0 -21px}
.rings i{position:relative;display:block;width:56px;height:27px}
.rings i svg{position:absolute;left:0;top:0;width:56px;height:27px;overflow:visible}
.rings i svg.back{z-index:0}
.rings i svg.front{z-index:3;filter:drop-shadow(0 3px 2px rgba(110,90,60,.28))}
.rings i::before,.rings i::after{content:"";position:absolute;z-index:2;top:15px;width:8px;height:7px;border-radius:50%;background:radial-gradient(ellipse,#8e8374 0 42%,#bfb29c 62%,transparent 72%)}
.rings i::before{left:2px}
.rings i::after{right:2px}

/* 인덱스 탭 */
.index{position:absolute;right:-36px;top:34px;display:flex;flex-direction:column;gap:8px}
.index a{display:flex;align-items:center;justify-content:center;width:34px;height:74px;border:0;border-radius:0 10px 10px 0;
  writing-mode:vertical-rl;font-family:var(--font-display);font-size:13px;letter-spacing:.08em;color:rgba(75,51,38,.5);text-decoration:none;line-height:1}
.index a:nth-child(1){background:#ffd3a8}
.index a:nth-child(2){background:#d9edc0}
.index a:nth-child(3){background:#d3ddf6}
.index a:nth-child(4){background:#fccfbf}
.index a:hover{filter:brightness(1.05)}

/* 작가증 */
.pcard{position:relative;background:#fff;border:0;border-radius:14px;box-shadow:var(--drop);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard .head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;padding:0 16px;background:var(--yellow)}
.pcard .head b{font-family:var(--font-display);font-weight:400;font-size:17px;line-height:1;color:rgba(75,51,38,.5);letter-spacing:.04em}
.pcard .head .hole{width:34px;height:10px;border-radius:5px;background:var(--paper);box-shadow:inset 0 1px 2px rgba(150,105,50,.3)}
.pcard .body{padding:var(--sp);display:flex;flex-direction:column;gap:var(--sp-s)}
.photo{width:120px;height:120px;margin:0 auto;border-radius:12px;background:var(--paper);box-shadow:0 2px 8px rgba(150,105,50,.14)}
.pcard .who{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pcard .pname{font-family:"LINESeed",var(--font-body);font-weight:700;color:rgba(75,51,38,.8);font-size:22px;line-height:1.25;word-break:break-all}
.pcard .phandle{font-size:12px;color:var(--muted);word-break:break-all}
.pcard .plabel{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:15px;line-height:1;color:var(--orange-ink);padding-top:var(--sp-s);border-top:2px dashed var(--grid)}
.pcard .intro{padding-top:var(--sp-s);border-top:2px dashed var(--grid)}
.intro{display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.75;word-break:break-word;min-width:0}
.intro p{margin:0}
.intro p.strong{font-weight:700}
.intro .cut{border-top:2px dashed var(--grid);margin:4px 0}
.intro ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.intro li::marker{color:var(--orange)}
.pform{display:flex;flex-direction:column;gap:8px}
.pform label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--orange-ink)}
.pform input,.pform textarea{width:100%;font:13px/1.6 var(--font-body);color:var(--ink);background:var(--paper);border:2px solid var(--grid);border-radius:8px;padding:8px 10px}
.pform textarea{min-height:240px;resize:vertical}
.pform input:focus,.pform textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.pform .hint{font-size:11px;color:var(--muted);line-height:1.6;font-weight:400}

/* 오른쪽 페이지 섹션 */
.sec{display:flex;flex-direction:column;gap:var(--sp-s);min-width:0;scroll-margin-top:16px}
.sec h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:400;font-size:20px;line-height:1;color:rgba(75,51,38,.5)}
.sec h2 small{font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em}
.links{display:flex;flex-direction:column;gap:var(--sp-s)}
.lk{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;background:#fff;border-radius:10px;box-shadow:var(--drop);color:inherit;text-decoration:none;transition:transform .15s}
.lk:hover{transform:translateX(3px)}
.lk .name{flex:none;display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:86px;padding:0 10px;line-height:1;border-radius:13px;font-family:var(--font-display);font-size:13px}
.lk.bsky .name{background:#cfdcf7}
.lk.x .name{background:var(--yellow)}
.lk .url{min-width:0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.polaroid{position:relative;align-self:center;width:94%;background:#fff;box-shadow:var(--drop);padding:10px;transform:rotate(-1.2deg)}
.polaroid .banner{width:100%;aspect-ratio:1.8/1}
.polaroid .tape{left:50%;top:-14px;transform:translateX(-50%) rotate(-3deg)}
.clipzone{position:relative;--tabh:50px;filter:drop-shadow(0 8px 16px rgba(150,105,50,.16))}
.clipper{position:absolute;right:120px;top:calc(var(--tabh) - 50px);width:30px;height:114px;transform:rotate(-35deg);transform-origin:50% 50%;pointer-events:none}
.clipper.back{z-index:0}
.clipper.front{z-index:3;filter:drop-shadow(1px 2px 0 rgba(150,110,60,.18))}

.chans{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-s)}
.chan{display:flex;flex-direction:column;gap:8px;min-width:0;color:inherit;text-decoration:none}
.chan .card{display:flex;align-items:center;gap:var(--sp-s);padding:8px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--drop);transition:transform .15s}
.chan:hover .card{transform:translateY(-3px)}
.thumb{display:block;flex:none;width:56px;height:56px;border-radius:8px;object-fit:cover;background:#fff}
.chanbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.linkedit{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--orange-ink)}
.linkedit[hidden]{display:none}
.linkedit input{width:100%;font:12px/1.5 var(--font-body);color:var(--ink);background:var(--paper);border:2px solid var(--grid);border-radius:8px;padding:6px 8px}
.linkedit input:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.chan .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.chan .meta strong{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan .meta small{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


.games{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--sp-s)}
.game{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.game .ic{position:relative;width:100%;max-width:58px;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--drop)}
.game .ic img{display:block;width:100%;height:100%;object-fit:cover}
.game .nm{width:100%;font-size:11px;color:rgba(75,51,38,.5);line-height:1.3;text-align:center;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.game .x{position:absolute;top:2px;right:2px;display:flex;align-items:center;justify-content:center;width:15px;height:15px;padding:0;line-height:1;border:0;border-radius:50%;background:rgba(75,51,38,.75);color:#fff;font-size:12px;cursor:pointer}
.game textarea{width:100%;min-width:0;height:calc(2.6em + 10px);font:11px/1.3 var(--font-body);text-align:center;color:var(--ink);background:#fff;border:2px solid var(--grid);border-radius:6px;padding:3px 4px;resize:none;overflow:hidden}
.game textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.game-add{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:0;border:0;background:none;cursor:pointer;font:700 10px var(--font-body);color:var(--orange-ink);white-space:nowrap}
.game-add span{display:flex;align-items:center;justify-content:center;width:100%;max-width:58px;aspect-ratio:1;line-height:1;border-radius:14px;border:2px dashed var(--orange);font-size:20px;font-weight:400;background:rgba(255,255,255,.6)}
.games-empty{margin:0;font-size:12px;color:var(--muted)}

.np{display:flex;align-items:center;gap:var(--sp-s);padding:10px 14px 10px 10px;border-radius:14px;background:#fff;box-shadow:var(--drop);color:inherit;text-decoration:none;min-width:0}
.np[data-off]{pointer-events:none}
.np-disc{position:relative;flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;
  background:repeating-radial-gradient(circle,#3b2c24 0 1.5px,#4c3b31 1.5px 3px);
  box-shadow:0 2px 6px rgba(80,50,20,.25);animation:spin 4s linear infinite}
.np-disc::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.28) 12%,transparent 18% 55%,rgba(255,255,255,.18) 60%,transparent 66%)}
.np-cover{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb04a,var(--orange))}
.np-cover.empty{background:radial-gradient(circle at 35% 35%,#ffb04a,var(--orange))}
.np-cover::before{content:"";position:absolute;left:50%;top:50%;z-index:2;width:5px;height:5px;transform:translate(-50%,-50%);border-radius:50%;background:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
body.editing .np-disc{animation-play-state:paused}
.np-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.np-txt strong{font-family:var(--font-display);font-weight:400;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-txt small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{flex:none;display:flex;align-items:center;gap:3px;height:28px}
.eq i{display:block;width:4px;height:100%;border-radius:2px;background:linear-gradient(var(--orange),var(--yellow));transform-origin:50% 50%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(1){animation-duration:.9s;animation-delay:-.2s}
.eq i:nth-child(2){animation-duration:1.1s;animation-delay:-.5s}
.eq i:nth-child(3){animation-duration:.8s;animation-delay:-.1s}
.eq i:nth-child(4){animation-duration:1.2s;animation-delay:-.7s}
.eq i:nth-child(5){animation-duration:.95s;animation-delay:-.3s}
.eq i:nth-child(6){animation-duration:1.05s;animation-delay:-.6s}
.eq i:nth-child(7){animation-duration:.85s;animation-delay:-.4s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.np-edit{display:flex;flex-direction:column;gap:8px}
.np-edit[hidden]{display:none}
.np-edit label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--orange-ink)}
.np-edit input{width:100%;font:12px/1.5 var(--font-body);color:var(--ink);background:var(--paper);border:2px solid var(--grid);border-radius:8px;padding:6px 8px}
.np-edit input:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
body.editing .np,body.editing .np[data-off]{pointer-events:auto}

body.editing .postcard{top:auto;bottom:-20px}
body.editing .paste-on{box-shadow:0 0 0 3px rgba(239,138,51,.45),var(--drop)!important}
body.editing [data-t]{outline:1.5px dashed var(--orange);outline-offset:3px;border-radius:3px;cursor:text}
body.editing [data-t]:focus{outline-style:solid;background:rgba(255,255,255,.5)}

/* 그림 다듬기 창 */
.ed{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(70,48,25,.45)}
.ed[hidden]{display:none}
.ed-box{width:100%;max-width:600px;max-height:100%;overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--drop);padding:18px;display:flex;flex-direction:column;gap:12px}
.ed-title{margin:0;font-family:var(--font-display);font-size:18px;line-height:1.2}
.ed-stage{position:relative;width:100%;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#f4ecdc 0 25%,#fffaf0 0 50%) 0 0/16px 16px}
.ed-stage canvas{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
.ed-stage canvas:active{cursor:grabbing}
.ed-row{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--orange-ink)}
.ed-row input{width:100%;accent-color:var(--orange)}
.ed-btns,.ed-actions{display:flex;flex-wrap:wrap;gap:8px}
.ed-actions{justify-content:flex-end}
.ed button{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;line-height:1;border:0;border-radius:17px;background:var(--paper);color:var(--ink);font:700 12px var(--font-body);cursor:pointer;box-shadow:0 1px 4px rgba(150,105,50,.22)}
.ed button.primary{background:var(--orange);color:#fff}
.ed button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ed-hint{margin:0;font-size:11px;color:var(--muted)}

/* 편집 막대 */
.bar{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20}
.bar button{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;line-height:1;border:0;border-radius:20px;font:700 13px var(--font-body);cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:var(--drop)}
.bar button.primary{background:var(--orange);color:#fff}
.bar button:disabled{opacity:.6;cursor:default}
.bar button:focus-visible,.slot:focus-visible,.lk:focus-visible,.chan:focus-visible,.index a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;font-size:12px;padding:8px 14px;border-radius:16px;z-index:21}

@media (max-width:760px){
  .wrap{padding-block:18px 40px}
  .clipzone{--tabh:42px}
  .clipper{right:56px}
  .tab{padding:10px 12px 7px}
  .tab span{height:26px;padding:0 12px;font-size:16px}
  :root{--sp:14px;--sp-s:8px}
  .folder{border-radius:0 18px 18px 18px}
  .hero{aspect-ratio:2.4/1}
  .postcard{right:-6px;top:-18px;width:50%;padding:0;border-width:4px}
  .ie-row{grid-template-columns:28px minmax(0,1fr) auto}
  .ie-row b{display:none}
  .icons a{width:40px;height:40px}
  h1{font-size:28px}
  .titlebar{margin-top:2px}
  .binder{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 14px auto}
  .page.left{padding:var(--sp) var(--sp) calc(var(--sp) + 14px)}
  .page.right{padding:calc(var(--sp) + 14px) var(--sp) var(--sp)}
  .page.left,.page.right{border-radius:14px}
  .page.left{background-image:linear-gradient(to top,var(--spine),transparent 18px,transparent 40px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
  .page.right{background-image:linear-gradient(to bottom,var(--spine),transparent 18px,transparent 40px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
  .page.left,.page.right{box-shadow:0 3px 0 var(--s1),0 6px 0 var(--s2),0 12px 16px rgba(150,105,50,.2)}
  .rings{flex-direction:row;margin:-21px 0}
  .rings i{width:27px;height:56px}
  .rings i svg{left:-14.5px;top:14.5px;transform:rotate(90deg)}
  .rings i::before,.rings i::after{left:3px;right:auto;width:7px;height:8px}
  .rings i::before{top:2px}
  .rings i::after{top:auto;bottom:2px}
  .index{display:none}
  .lk .name{min-width:74px}
  .games{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp)}
  .game .ic,.game-add span{width:76px;max-width:none;height:76px;border-radius:19px}
  .game-add{font-size:11px}
  .game .nm,.game textarea{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.lk,.chan .card,.icons a{transition:none}.np-disc,.eq i{animation:none}.eq i{transform:scaleY(.6)}}
</style>

<script type="application/json" id="slots">{"img":{"banner":"images/7099cc14865cc43763e56964b0878a43.webp","hero":"images/ae7b63738a14e9d8c88aec0d1dee7def.webp","cat":"images/9af789d8b027fc22cfd3b53438c7cf98.webp","album":"images/13cfbab6c6e032095e89b41b21dccc35.webp"},"name":"귤탱","handle":"@UuuuUuuu9090","links":{"postype":"https://www.postype.com/@todrbfxodrbf?utm_source=link&utm_medium=social&utm_content=if_sh_wl&utm_campaign=channel","crepe":"https://kre.pe/R1ab"},"sns":{"bsky":"https://bsky.app/profile/uuuuuuuu9090.bsky.social","x":"https://x.com/UuuuUuuu9090"},"iconOrder":["x","crepe","postype","bsky"],"cards":["images/1a95348957661184b34f6f02264029df.webp","images/bad39bd732346c6c8bf2ff6952a81b05.webp","images/1b34570c954fc401308b243e769cee2a.webp","images/4e83cbc44e5177204a9b66603f4339fc.webp","images/6201e726b0a38c7ac54159c294186001.webp","images/baacb454cf5cad1f7421a4be8f623282.webp","images/722d158f6ded73e81903adafc881a99c.webp"],"memo":"바쁨...가끔...게임...","intro":"그림그림\n---\n","text":{},"tags":["1차위주","2차 가끔","그림","성인"],"music":{"title":" ᐳone","artist":"ericdoa","url":"https://youtu.be/MHxJXBLJW98?si=FkVNFuD0940gJRMB"},"games":[{"src":"images/416017d79b54c087de81ac46db5f81b9.webp","name":"VALORANT"},{"src":"images/701dc46b85b6b6c09e8bf11c3366bb03.webp","name":"CYPHERS"},{"src":"images/2ddad280a13ebdded547eb7c46dcbdde.webp","name":"MONSTER HUNTER "},{"src":"images/a3858fce41dab37abe02e1a7cc87f102.webp","name":"명일방주"},{"src":"images/85e198c7555a3d3510954e6f2cb23f7c.webp","name":"명일방주\n엔드필드"},{"src":"images/49293a4f5ffefff4741858eb3e7d0b4f.webp","name":"망각전야"}]}</script>
<script>
(function(){
  // 처음 상태의 페이지 원본 (저장할 때 그림 목록만 바꿔서 다시 게시)
  const SOURCE = document.body.innerHTML;
  const NAMES = {hero:"맨 위 그림",album:"앨범 표지",cat:"캐릭터",banner:"메인 그림"};
  let state = {};
  try{ state = JSON.parse(document.getElementById('slots').textContent) || {}; }catch(e){ state = {}; }
  state.img = state.img || {};
  if(state.name == null) state.name = '귤탱';
  if(state.handle == null) state.handle = '@UuuuUuuu9090';
  state.links = state.links || {postype:'https://www.postype.com/@todrbfxodrbf', crepe:'https://kre.pe/R1ab'};
  state.sns = state.sns || {bsky:'https://bsky.app/profile/uuuuuuuu9090.bsky.social', x:'https://x.com/UuuuUuuu9090'};
  state.iconOrder = Array.isArray(state.iconOrder) && state.iconOrder.length===4 ? state.iconOrder : ['bsky','x','postype','crepe'];
  state.text = state.text || {};
  state.tags = Array.isArray(state.tags) ? state.tags : ['1차위주','2차 가끔','그림','성인'];
  state.music = state.music || {title:'노래 제목', artist:'가수 이름', url:''};
  state.games = Array.isArray(state.games) ? state.games.slice(0,6) : [];
  state.cards = Array.isArray(state.cards) ? state.cards : [];
  state.credits = (state.credits && typeof state.credits==='object') ? state.credits : {};
  let cardIdx = Math.floor(Math.random()*1e6);
  if(state.memo == null) state.memo = '커미션 공지나 알림을 여기에 적어 주세요.';
  if(state.intro == null) state.intro = 'X : @UuuuUuuu9090\n---\n**여기에 소개글을 적어 주세요.**\n- 목록은 이렇게\n- 줄 앞에 - 를 붙여요';

  const ICON_NAME = {bsky:'Bluesky', x:'X', postype:'Postype', crepe:'Crepe'};
  const iconUrl = k => (k in state.sns ? state.sns[k] : state.links[k]) || '';
  const safe = u => /^https?:\/\//.test(u) ? u : '#';
  function renderIcons(){
    const nav = $('.icons');
    state.iconOrder.forEach(k=>{ const a = nav.querySelector('[data-k="'+k+'"]'); if(a){ a.href = safe(iconUrl(k)); nav.appendChild(a); } });
  }
  function renderIconEdit(){
    const box = $('#iconEdit'); box.innerHTML = '';
    const t = document.createElement('div'); t.className='ttl'; t.textContent='아이콘 순서와 링크'; box.appendChild(t);
    state.iconOrder.forEach((k,i)=>{
      const row = document.createElement('div'); row.className='ie-row';
      const im = document.createElement('img'); im.alt=''; im.src = $('.icons [data-k="'+k+'"] img').src;
      const b = document.createElement('b'); b.textContent = ICON_NAME[k];
      const inp = document.createElement('input'); inp.type='url'; inp.value = iconUrl(k); inp.setAttribute('aria-label', ICON_NAME[k]+' 링크');
      inp.addEventListener('input', e=>{ const v=e.target.value.trim(); if(k in state.sns) state.sns[k]=v; else state.links[k]=v; dirty=true; });
      const mv = document.createElement('div'); mv.className='mv';
      [['◀',-1,'앞으로'],['▶',1,'뒤로']].forEach(([txt,d,lab])=>{
        const bt = document.createElement('button'); bt.type='button'; bt.textContent=txt; bt.setAttribute('aria-label', ICON_NAME[k]+' '+lab);
        bt.disabled = (i+d<0 || i+d>3);
        bt.addEventListener('click', ()=>{ const o=state.iconOrder; [o[i],o[i+d]]=[o[i+d],o[i]]; dirty=true; renderIcons(); renderIconEdit(); });
        mv.appendChild(bt);
      });
      row.append(im,b,inp,mv); box.appendChild(row);
    });
  }

  function applyText(){
    document.querySelectorAll('[data-t]').forEach(el=>{ const v = state.text[el.dataset.t]; if(v) el.textContent = v; });
  }
  function renderTags(){
    const box = $('#pTags'); box.innerHTML = '';
    state.tags.forEach(t=>{ const sp = document.createElement('span'); sp.textContent = t; box.appendChild(sp); });
    box.hidden = !state.tags.length;
  }

  function renderMusic(){
    $('#npTitle').textContent = state.music.title || '노래 제목';
    $('#npArtist').textContent = state.music.artist || '';
    const a = $('#npLink'), ok = /^https?:\/\//.test(state.music.url||'');
    a.href = ok ? state.music.url : '#'; a.toggleAttribute('data-off', !ok);
  }

  function renderGames(){
    const box = $('#games'); box.innerHTML = '';
    state.games.forEach((g,i)=>{
      const it = document.createElement('div'); it.className='game';
      const ic = document.createElement('div'); ic.className='ic';
      const im = document.createElement('img'); im.src=srcOf(g.src); im.alt=g.name||''; ic.appendChild(im);
      if(editing){
        const x = document.createElement('button'); x.type='button'; x.className='x'; x.textContent='×'; x.setAttribute('aria-label',(g.name||'게임')+' 빼기');
        x.addEventListener('click', ()=>{ state.games.splice(i,1); dirty=true; renderGames(); });
        ic.appendChild(x); it.appendChild(ic);
        const inp = document.createElement('textarea'); inp.rows=2; inp.maxLength=30; inp.placeholder='이름'; inp.value=g.name||''; inp.setAttribute('aria-label','게임 이름');
        inp.addEventListener('input', e=>{ const lines=e.target.value.split('\n'); if(lines.length>2){ e.target.value=lines.slice(0,2).join('\n'); } g.name=e.target.value; dirty=true; });
        it.appendChild(inp);
      } else {
        it.appendChild(ic);
        if(g.name){ const nm=document.createElement('div'); nm.className='nm'; nm.textContent=g.name; it.appendChild(nm); }
      }
      box.appendChild(it);
    });
    if(editing && state.games.length < 6){
      const add = document.createElement('button'); add.type='button'; add.className='game-add';
      const sp = document.createElement('span'); sp.textContent='+'; add.append(sp, document.createTextNode('게임 추가'));
      add.addEventListener('click', ()=>{ current='__game'; const fi=$('#fileInput'); fi.multiple=true; fi.value=''; fi.click(); });
      box.appendChild(add);
    }
    const empty = !state.games.length;
    $('#gamesEmpty').hidden = !(empty && !editing);
    $('#game').hidden = empty && !editing && !document.body.dataset.showEmptyGames;
  }

  function renderCard(){
    const img = $('#pcImg'), n = state.cards.length;
    if(n){ img.src = srcOf(state.cards[cardIdx % n]); img.hidden = false; $('#pcEmpty').hidden = true; }
    else { img.hidden = true; img.removeAttribute('src'); $('#pcEmpty').hidden = false; }
    const cur = n ? state.cards[cardIdx % n] : null, cr = (cur && state.credits[cur]) || '', cel = $('#pcCredit');
    cel.textContent = ''; cel.hidden = !cr;
    if(cr){ if(/^https?:\/\//.test(cr)){ const a=document.createElement('a'); a.href=cr; a.target='_blank'; a.rel='noopener'; a.textContent=cr.replace(/^https?:\/\/(www\.)?/,''); cel.append('출처 · ', a); } else cel.textContent = '출처 · ' + cr; }
    const ci = $('#inCredit'); if(ci){ if(document.activeElement!==ci) ci.value = cr; ci.disabled = !cur; }
    const box = $('#pcThumbs'); box.innerHTML = '';
    state.cards.forEach((u,i)=>{
      const f = document.createElement('figure'); if(n && i===cardIdx % n) f.className='on';
      f.addEventListener('click', ()=>{ cardIdx = i; renderCard(); });
      const im = document.createElement('img'); im.src = srcOf(u); im.alt = '';
      const b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', (i+1)+'번째 엽서 그림 빼기');
      b.addEventListener('click', ev=>{ ev.stopPropagation(); delete state.credits[state.cards[i]]; state.cards.splice(i,1); dirty = true; renderCard(); });
      f.append(im,b); box.appendChild(f);
    });
  }

  function renderProfile(){
    $('#mText').textContent = state.memo;
    renderCard();
    renderIcons();
    renderGames();
    renderMusic();
    renderTags();
    applyText();
    [['postype','#chPostype'],['crepe','#chCrepe']].forEach(([k,sel])=>{
      const u = state.links[k] || '#'; const a = $(sel);
      a.href = /^https?:\/\//.test(u) ? u : '#';
      a.querySelector('.u').textContent = u.replace(/^https?:\/\/(www\.)?/,'');
      const ic = $(k==='postype' ? '#icPostype' : '#icCrepe'); if(ic) ic.href = a.href;
    });
    $('#pName').textContent = state.name;
    $('#pHandle').textContent = state.handle;
    const box = $('#pIntro'); box.innerHTML = '';
    let ul = null;
    state.intro.split('\n').forEach(raw=>{
      const line = raw.trim();
      if(/^-\s+/.test(line)){
        if(!ul){ ul = document.createElement('ul'); box.appendChild(ul); }
        const li = document.createElement('li'); li.textContent = line.replace(/^-\s+/,''); ul.appendChild(li); return;
      }
      ul = null;
      if(line === '') return;
      if(/^-{3,}$/.test(line)){ const d=document.createElement('div'); d.className='cut'; box.appendChild(d); return; }
      const p = document.createElement('p');
      const m = line.match(/^\*\*(.+)\*\*$/);
      if(m){ p.className='strong'; p.textContent=m[1]; } else p.textContent = line;
      box.appendChild(p);
    });
  }
  let dirty = false, editing = false, assets = null, artifact = null, current = null;
  // ── 깃허브 저장 ──
  const GH = (()=>{ const m = location.hostname.match(/^([^.]+)\.github\.io$/i); if(!m) return null;
    const seg = location.pathname.split('/').filter(Boolean)[0];
    return {owner:m[1], repo:(seg && !/\.html?$/i.test(seg)) ? seg : m[1]+'.github.io'}; })();
  let token = null; try{ token = localStorage.getItem('gh_token'); }catch(e){}
  if(/logout/.test(location.hash)){ try{ localStorage.removeItem('gh_token'); }catch(e){} token = null; }
  const previews = {};
  const srcOf = u => previews[u] || u;
  async function gh(path, opt){
    opt = opt || {};
    const r = await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+path, Object.assign({}, opt, {cache:'no-store', headers:{Authorization:'Bearer '+token, Accept:'application/vnd.github+json'}}));
    if(!r.ok){ const e = new Error('github '+r.status); e.status = r.status; throw e; }
    return r.json();
  }
  const blobB64 = b => new Promise((ok,no)=>{ const fr = new FileReader(); fr.onload = ()=>ok(String(fr.result).split(',')[1]); fr.onerror = no; fr.readAsDataURL(b); });
  const textB64 = s => { const u = new TextEncoder().encode(s); let bin=''; for(let i=0;i<u.length;i+=0x8000) bin += String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(bin); };
  async function ghUpload(blob){
    const name = 'images/' + Date.now().toString(36) + Math.random().toString(36).slice(2,7) + (blob.type==='image/png' ? '.png' : '.jpg');
    await gh(name, {method:'PUT', body:JSON.stringify({message:'그림 추가', content: await blobB64(blob)})});
    previews[name] = URL.createObjectURL(blob);
    return name;
  }
  async function askToken(){
    const t = (prompt('깃허브 편집 열쇠(토큰)를 넣어 주세요.\n이 기기의 브라우저에만 저장돼요.') || '').trim();
    if(!t) return false;
    token = t;
    try{ const r = await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo, {headers:{Authorization:'Bearer '+t}}); const j = await r.json(); if(!r.ok || !(j.permissions && j.permissions.push)) throw 0; }
    catch(e){ token = null; toast('열쇠가 맞지 않거나 이 저장소를 고칠 권한이 없어요.'); return false; }
    try{ localStorage.setItem('gh_token', t); }catch(e){}
    return true;
  }

  const $ = s => document.querySelector(s);
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }

  function render(){
    document.querySelectorAll('.slot').forEach(el=>{
      const key = el.dataset.slot, src = state.img[key];
      el.innerHTML = '';
      el.classList.toggle('empty', !src);
      if(src){ const img=document.createElement('img'); img.src=srcOf(src); img.alt=''; img.loading='lazy'; el.appendChild(img); }
      const p=document.createElement('div'); p.className='pick';
      const s=document.createElement('span'); s.textContent = el.classList.contains('tiny') ? '+' : (src ? '바꾸기' : '그림 넣기'); p.appendChild(s); el.appendChild(p);
      if(editing){ el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label', NAMES[key]+' 그림 넣기'); }
      else { el.removeAttribute('tabindex'); el.removeAttribute('role'); el.removeAttribute('aria-label'); }
    });
  }

  function setEditing(on){
    editing = on; document.body.classList.toggle('editing', on);
    $('#editBtn').textContent = on ? '편집 끝내기' : '그림 편집';
    $('#saveBtn').hidden = !on;
    if(on) toast('칸을 누르면 그림 고르기, 칸 위에서 Ctrl+V로 붙여넣기도 돼요.'); else { pasteKey = null; markPaste(); }
    $('#pForm').hidden = !on; $('#pIntro').hidden = on; $('.pcard .who').hidden = on; $('#mText').hidden = on; $('.memo-edit').hidden = !on; $('#pcEdit').hidden = !on; $('#iconEdit').hidden = !on; if(on) renderIconEdit(); renderGames(); $('#npEdit').hidden = !on; document.querySelectorAll('[data-t]').forEach(el=>{ if(on){ el.setAttribute('contenteditable','plaintext-only'); if(el.contentEditable!=='plaintext-only') el.setAttribute('contenteditable','true'); el.spellcheck=false; } else el.removeAttribute('contenteditable'); }); if(on) $('#inTags').value = state.tags.join(', '); if(on){ $('#inNpTitle').value = state.music.title; $('#inNpArtist').value = state.music.artist; $('#inNpUrl').value = state.music.url; } else renderMusic(); document.querySelectorAll('.linkedit').forEach(l=>l.hidden=!on);
    if(on){ $('#inName').value = state.name; $('#inHandle').value = state.handle; $('#inIntro').value = state.intro; $('#inMemo').value = state.memo; $('#inPostype').value = state.links.postype; $('#inCrepe').value = state.links.crepe; }
    else renderProfile();
    render();
  }

  // 그림 다듬기: 자르기(끌기) · 확대 · 회전
  const ASPECT = {hero:4, cat:1, banner:1.8, album:1, __card:1.5, __game:1};
  function editImage(file, aspect, label){
    return new Promise(resolve=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onerror = ()=>{ URL.revokeObjectURL(url); toast('그림을 열지 못했어요.'); resolve(null); };
      img.onload = ()=>{
        const ed = $('#ed'), cv = $('#edCanvas'), ctx = cv.getContext('2d');
        const zoomIn = $('#edZoom'), angIn = $('#edAngle');
        let z=1, rot=0, ox=0, oy=0, drag=null;
        $('#edTitle').textContent = label + ' 다듬기';
        ed.hidden = false;
        const cw = Math.round(Math.min(564, ed.querySelector('.ed-stage').clientWidth || 564)) * 2;
        cv.width = cw; cv.height = Math.round(cw / aspect);
        function angle(){ return (rot*90 + parseFloat(angIn.value)) * Math.PI/180; }
        function base(W,H){ const a=angle(), c=Math.abs(Math.cos(a)), s=Math.abs(Math.sin(a)); return Math.max(W/(img.width*c+img.height*s), H/(img.width*s+img.height*c)); }
        function paint(c2, W, H, k){
          c2.clearRect(0,0,W,H); c2.save();
          c2.translate(W/2 + ox*k, H/2 + oy*k); c2.rotate(angle());
          const sc = base(W,H)*z; c2.scale(sc, sc);
          c2.drawImage(img, -img.width/2, -img.height/2); c2.restore();
        }
        function draw(){ z = parseFloat(zoomIn.value); paint(ctx, cv.width, cv.height, 1); }
        function reset(){ zoomIn.value=1; angIn.value=0; rot=0; ox=0; oy=0; draw(); }
        const toCanvas = e=>{ const r=cv.getBoundingClientRect(); return cv.width / r.width; };
        cv.onpointerdown = e=>{ cv.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY,ox,oy,k:toCanvas()}; };
        cv.onpointermove = e=>{ if(!drag) return; ox = drag.ox + (e.clientX-drag.x)*drag.k; oy = drag.oy + (e.clientY-drag.y)*drag.k; draw(); };
        cv.onpointerup = cv.onpointercancel = ()=>{ drag=null; };
        cv.onwheel = e=>{ e.preventDefault(); zoomIn.value = Math.min(4, Math.max(1, parseFloat(zoomIn.value) - e.deltaY*0.002)); draw(); };
        zoomIn.oninput = draw; angIn.oninput = draw;
        $('#edRotL').onclick = ()=>{ rot=(rot+3)%4; draw(); };
        $('#edRotR').onclick = ()=>{ rot=(rot+1)%4; draw(); };
        $('#edReset').onclick = reset;
        function close(result){ ed.hidden = true; URL.revokeObjectURL(url); resolve(result); }
        $('#edCancel').onclick = ()=>close(null);
        ed.onkeydown = e=>{ if(e.key==='Escape') close(null); };
        $('#edOk').onclick = ()=>{
          const outW = aspect >= 2 ? 2000 : 1400, outH = Math.round(outW/aspect);
          const oc = document.createElement('canvas'); oc.width = outW; oc.height = outH;
          paint(oc.getContext('2d'), outW, outH, outW/cv.width);
          const png = file.type === 'image/png' || file.type === 'image/webp';
          oc.toBlob(b=>close(b), png ? 'image/png' : 'image/jpeg', 0.9);
        };
        reset(); $('#edOk').focus();
      };
      img.src = url;
    });
  }

  function choose(el){ if(!editing) return; current = el.dataset.slot; const fi=$('#fileInput'); fi.multiple=false; fi.value=''; fi.click(); }
  $('#pcAdd').addEventListener('click', ()=>{ current='__card'; const fi=$('#fileInput'); fi.multiple=true; fi.value=''; fi.click(); });

  document.addEventListener('click', e=>{
    const el = e.target.closest('.slot'); if(el && editing){ e.preventDefault(); choose(el); }
  });
  document.addEventListener('keydown', e=>{
    const el = e.target.closest && e.target.closest('.slot');
    if(el && editing && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); choose(el); }
  });

  $('#fileInput').addEventListener('change', e=>{ addImages([...e.target.files], current); });

  // 붙여넣기: 마우스를 올려 둔 칸(또는 마지막으로 누른 칸)에 클립보드 그림을 넣어요
  let pasteKey = null;
  function keyOf(el){
    if(!el) return null;
    const sl = el.closest('.slot'); if(sl) return sl.dataset.slot;
    if(el.closest('#postcard')) return '__card';
    if(el.closest('#game')) return '__game';
    return null;
  }
  document.addEventListener('mouseover', e=>{ if(!editing) return; const k = keyOf(e.target); if(k){ pasteKey = k; markPaste(); } });
  document.addEventListener('pointerdown', e=>{ if(!editing) return; const k = keyOf(e.target); if(k){ pasteKey = k; markPaste(); } }, true);
  function markPaste(){
    document.querySelectorAll('.paste-on').forEach(el=>el.classList.remove('paste-on'));
    if(!pasteKey) return;
    const el = pasteKey==='__card' ? $('#postcard') : pasteKey==='__game' ? $('#games') : document.querySelector('.slot[data-slot="'+pasteKey+'"]');
    if(el) el.classList.add('paste-on');
  }
  document.addEventListener('paste', e=>{
    if(!editing || !token) return;
    const t = e.target; if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) {
      const hasImg = [...(e.clipboardData?.items||[])].some(it=>it.kind==='file' && it.type.startsWith('image/'));
      if(!hasImg) return;
    }
    const files = [...(e.clipboardData?.items||[])].filter(it=>it.kind==='file' && it.type.startsWith('image/')).map(it=>it.getAsFile()).filter(Boolean);
    if(!files.length) return;
    e.preventDefault();
    if(!pasteKey){ toast('그림을 넣을 칸을 한 번 누르거나 마우스를 올린 뒤 붙여넣어 주세요.'); return; }
    addImages(files, pasteKey);
  });

  async function addImages(files, key){
    if(!files.length || !key) return;
    const label = key==='__card' ? '엽서 그림' : key==='__game' ? '게임 아이콘' : NAMES[key];
    for(const f of files){
      const edited = await editImage(f, ASPECT[key] || 1, label);
      if(!edited) continue;
      try{
        toast(label+' 올리는 중…');
        const url = await ghUpload(edited);
        if(key==='__card'){ state.cards.push(url); cardIdx = state.cards.length-1; renderCard(); }
        else if(key==='__game'){ if(state.games.length >= 6){ toast('게임 아이콘은 6개까지 넣을 수 있어요.'); continue; } state.games.push({src:url, name:''}); renderGames(); }
        else { state.img[key] = url; render(); }
        dirty = true;
        toast(label+' 넣었어요. 다 넣고 저장하기를 눌러 주세요.');
      }catch(err){
        const c = err && err.code;
        toast(c==='too_large' ? '그림이 너무 커요. 20MB 아래로 줄여 주세요.' : c==='unsupported_type' ? '이 파일 형식은 넣을 수 없어요.' : '그림을 올리지 못했어요. 다시 시도해 주세요.');
      }
    }
  }

  $('#editBtn').addEventListener('click', async ()=>{
    if(!editing && !token && !(await askToken())) return;
    if(editing && dirty){ toast('저장하지 않은 그림이 있어요. 저장하기를 눌러 주세요.'); }
    setEditing(!editing);
  });

  $('#saveBtn').addEventListener('click', async ()=>{
    if(!GH || !token){ toast('지금은 저장할 수 없어요.'); return; }
    const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = '저장 중…';
    try{
      let sha; try{ sha = (await gh('data.json')).sha; }catch(e){ if(e.status!==404) throw e; }
      const body = {message:'사이트 수정', content: textB64(JSON.stringify(state, null, 1))}; if(sha) body.sha = sha;
      await gh('data.json', {method:'PUT', body:JSON.stringify(body)});
      dirty = false; toast('저장했어요! 1~2분 뒤 사이트에 반영돼요.');
    }catch(err){
      if(err.status===401 || err.status===403){ toast('열쇠가 만료됐거나 권한이 없어요. 다시 넣어 주세요.'); try{ localStorage.removeItem('gh_token'); }catch(e){} token = null; }
      else if(err.status===409) toast('다른 곳에서 먼저 저장됐어요. 다시 눌러 주세요.');
      else toast('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.');
    }finally{ btn.disabled=false; btn.textContent='저장하기'; }
  });

  [['#inPostype','postype'],['#inCrepe','crepe']].forEach(([sel,k])=>{
    $(sel).addEventListener('input', e=>{ state.links[k] = e.target.value.trim(); dirty = true; });
  });
  document.addEventListener('input', e=>{
    const el = e.target.closest && e.target.closest('[data-t]');
    if(el && editing){ state.text[el.dataset.t] = el.textContent.replace(/\s+/g,' ').trim(); dirty = true; }
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.closest && e.target.closest('[data-t]')){ e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('click', e=>{
    if(editing && e.target.closest('a') && !e.target.closest('.slot')) e.preventDefault();
  }, true);
  $('#inCredit').addEventListener('input', e=>{ const n=state.cards.length; if(!n) return; const u=state.cards[cardIdx % n], v=e.target.value.trim(); if(v) state.credits[u]=v; else delete state.credits[u]; dirty = true; renderCard(); });
  $('#inTags').addEventListener('input', e=>{ state.tags = e.target.value.split(',').map(t=>t.trim()).filter(Boolean).slice(0,8); dirty = true; renderTags(); });
  [['#inNpTitle','title'],['#inNpArtist','artist'],['#inNpUrl','url']].forEach(([sel,k])=>{
    $(sel).addEventListener('input', e=>{ state.music[k] = k==='url' ? e.target.value.trim() : e.target.value; dirty = true; renderMusic(); });
  });
  [['#inMemo','memo'],['#inName','name'],['#inHandle','handle'],['#inIntro','intro']].forEach(([sel,k])=>{
    $(sel).addEventListener('input', e=>{ state[k] = e.target.value; dirty = true; });
  });

  window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

  renderProfile();
  render();
  const done = ()=>document.documentElement.classList.remove('loading');
  fetch('data.json?t='+Date.now(), {cache:'no-store'}).then(r=>r.ok ? r.json() : null).then(d=>{
    if(d && typeof d==='object' && !editing){ Object.assign(state, d); state.games = (state.games||[]).slice(0,6); renderProfile(); render(); }
  }).catch(()=>{}).finally(done);
  if(GH && (token || /edit/.test(location.hash + location.search))) $('#bar').hidden = false;
  window.addEventListener('hashchange', ()=>{ if(GH && /edit/.test(location.hash)) $('#bar').hidden = false; });
})();
</script>
<!--page-end--></body></html>
